name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  determinism:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: pip install -r analysis/requirements.txt
      - name: Build
        run: make
      - name: Quick campaign is bit-identical to the reference
        run: make test
